name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Web sedí v kořeni volbats.cz, takže base zůstává '/'. Dokud běžel
      # na steinbauer.github.io/volbats/, musel build dostat VITE_BASE
      # s prefixem — s vlastní doménou by odkazy na assety mířily mimo.
      - run: npm run build

      - uses: actions/configure-pages@v6

      # dist/ obsahuje předgenerované HTML pro každou stránku a assety
      # s hashem v názvu.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
