<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volba pro město Trhové Sviny — komunální volby 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    header p {
      margin-top: 8px;
      color: #666;
      font-size: 1rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    section {
      max-width: 900px;
      margin: 0 auto 48px;
    }

    .html-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .html-card {
      display: block;
      text-decoration: none;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .html-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .html-card .thumb {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
    }

    .html-card .info {
      padding: 14px 16px;
      background: #fff;
    }

    .html-card .info strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    .html-card .info span {
      font-size: 0.8rem;
      color: #888;
    }

    .card-yellow .thumb { background: #eed239; color: #0d0d0d; }
    .card-white  .thumb { background: #ffffff; color: #1a1a1a; border-bottom: 1px solid #eee; }
    .card-dark   .thumb { background: #191c1f; color: #ffffff; }

    .img-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .img-card {
      display: block;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s;
      background: #fff;
    }

    .img-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .img-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .img-card .img-label {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Volba pro město Trhové Sviny</h1>
    <p>Komunální volby 2026 — přehled materiálů</p>
  </header>

  <section>
    <p class="section-title">Grafické návrhy</p>
    <div class="html-grid">

      <a class="html-card card-yellow" href="volba1.html">
        <div class="thumb">14</div>
        <div class="info">
          <strong>Volba 1</strong>
          <span>Žluté pozadí · číslo 14</span>
        </div>
      </a>

      <a class="html-card card-white" href="volba2.html">
        <div class="thumb">❤️</div>
        <div class="info">
          <strong>Volba 2</strong>
          <span>Bílé pozadí · gradientní srdce</span>
        </div>
      </a>

      <a class="html-card card-dark" href="volba3.html">
        <div class="thumb">14</div>
        <div class="info">
          <strong>Volba 3</strong>
          <span>Tmavé pozadí · číslo 14</span>
        </div>
      </a>

    </div>
  </section>

  <section>
    <p class="section-title">Obrázky</p>
    <div class="img-grid">
      <a class="img-card" href="4.png" target="_blank">
        <img src="4.png" alt="Obrázek 4">
        <div class="img-label">4.png</div>
      </a>
      <a class="img-card" href="5.png" target="_blank">
        <img src="5.png" alt="Obrázek 5">
        <div class="img-label">5.png</div>
      </a>
      <a class="img-card" href="6.png" target="_blank">
        <img src="6.png" alt="Obrázek 6">
        <div class="img-label">6.png</div>
      </a>
      <a class="img-card" href="7.png" target="_blank">
        <img src="7.png" alt="Obrázek 7">
        <div class="img-label">7.png</div>
      </a>
    </div>
  </section>

</body>
</html>
