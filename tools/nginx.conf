server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Adresy chodí bez lomítka na konci (/kontakt) a nginx na ně odpovídá
    # přesměrováním na /kontakt/. Za traefikem, který ukončuje TLS, ale nginx
    # nevidí původní schéma a poslal by absolutní Location s http:// —
    # prohlížeč by skončil na http, kde žádný router není, a viděl by 404.
    # Relativní Location zachová schéma i hostitele.
    absolute_redirect off;

    # Stránky jsou předgenerované do <cesta>/index.html; když soubor není,
    # spadneme na 404.html se stejnou aplikací (stejně jako GitHub Pages).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Soubory v assets/ mají hash obsahu v názvu, takže se nikdy nemění pod
    # rukama — můžou se cachovat natrvalo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML se naopak nesmí cachovat, jinak by prohlížeč po nasazení nové verze
    # držel starou stránku i se starými odkazy na assety — a byl by potřeba
    # ctrl+F5.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
